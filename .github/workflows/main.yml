name: Android Emulator Remote (scrcpy)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدة التشغيل بالساعات (الحد الأقصى 6)'
        required: true
        default: '6'
      api_level:
        description: 'إصدار أندرويد (API level)'
        required: true
        default: '30'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # أقصى حد 6 ساعات

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator and expose ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-window -no-boot-anim -no-audio -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: |
            # تفعيل ADB عبر TCP
            adb tcpip 5555

            # تحميل ngrok وعمل نفق TCP للمنفذ 5555
            wget -qO ngrok.tgz https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.tgz
            tar xf ngrok.tgz
            ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
            ./ngrok tcp 5555 --log=stdout > ngrok.log 2>&1 &
            sleep 10

            # طباعة عنوان الاتصال
            echo "🔗 عنوان ADB (استخدمه مع scrcpy أو adb connect):"
            curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*'

            # إبقاء المحاكي شغالاً للمدة المحددة
            sleep $(( ${{ github.event.inputs.duration }} * 3600 ))
